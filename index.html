<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>재입고신호</title>
    <meta http-equiv="refresh" content="0; url=landing.html" />
    <link rel="canonical" href="landing.html" />
    <script>
      const current = new URL(window.location.href);
      const opensDemo =
        current.searchParams.has("productNo") ||
        current.searchParams.get("tutorial") === "1";
      const target = new URL(
        opensDemo ? `demo.html${current.search}` : "landing.html",
        current,
      );
      window.location.replace(target.href);
    </script>
  </head>
  <body>
    <a href="landing.html">재입고신호 시작 화면으로 이동</a>
  </body>
</html>
