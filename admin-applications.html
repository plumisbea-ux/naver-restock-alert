<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>데모 신청 관리 | 재입고신호</title>
    <link rel="stylesheet" href="assets/global-nav.css" />
    <style>
      :root {
        --ink: #17191b;
        --muted: #687078;
        --line: #dfe3e5;
        --green: #03c75a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        background: #f4f6f5;
      }
      .wrap {
        width: min(1200px, calc(100% - 32px));
        margin: auto;
      }
      header {
        background: #17191b;
        color: #fff;
      }
      .head {
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .head strong {
        font-size: 20px;
      }
      .head button {
        height: 36px;
        padding: 0 13px;
        border: 1px solid #555;
        background: transparent;
        color: #fff;
      }
      .login {
        width: min(430px, calc(100% - 32px));
        margin: 110px auto;
        padding: 34px;
        border: 1px solid #c7cccf;
        background: #fff;
      }
      .login h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }
      .login p {
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 13px;
      }
      .login input {
        width: 100%;
        height: 50px;
        padding: 0 13px;
        border: 1px solid #aeb5b8;
      }
      .login button {
        width: 100%;
        height: 50px;
        margin-top: 10px;
        border: 0;
        background: var(--green);
        color: #fff;
        font-weight: 900;
      }
      .error {
        min-height: 20px;
        color: #c62828;
        font-size: 12px;
      }
      .dashboard {
        display: none;
        padding: 42px 0 80px;
      }
      .dashboard.on {
        display: block;
      }
      .summary {
        display: flex;
        align-items: end;
        justify-content: space-between;
        margin-bottom: 25px;
      }
      .summary h1 {
        margin: 0;
        font-size: 38px;
      }
      .summary strong {
        color: #008d41;
        font-size: 44px;
      }
      .tools {
        display: flex;
        gap: 8px;
        margin-bottom: 18px;
      }
      .tools input {
        flex: 1;
        height: 44px;
        padding: 0 13px;
        border: 1px solid #bbc1c4;
      }
      .tools button {
        padding: 0 16px;
        border: 1px solid #17191b;
        background: #fff;
        font-weight: 900;
      }
      .list {
        display: grid;
        gap: 12px;
      }
      .application {
        padding: 24px;
        border: 1px solid #cbd0d2;
        background: #fff;
      }
      .application-head {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 20px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--line);
      }
      .application h2 {
        margin: 0;
        font-size: 21px;
      }
      .application-head a {
        color: #008d41;
        font-size: 12px;
      }
      .date {
        color: var(--muted);
        font-size: 12px;
      }
      .data {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
        margin-top: 18px;
      }
      .datum small {
        display: block;
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 11px;
      }
      .datum b,
      .datum a {
        font-size: 14px;
        color: inherit;
      }
      .request {
        margin-top: 18px;
        padding: 15px;
        background: #f5f7f6;
        white-space: pre-wrap;
        font-size: 13px;
        line-height: 1.55;
      }
      .empty {
        padding: 70px;
        border: 1px solid var(--line);
        background: #fff;
        text-align: center;
        color: var(--muted);
      }
      @media (max-width: 700px) {
        .data {
          grid-template-columns: 1fr;
        }
        .summary {
          align-items: start;
        }
        .summary h1 {
          font-size: 28px;
        }
        .summary strong {
          font-size: 32px;
        }
        .tools {
          flex-wrap: wrap;
        }
        .tools input {
          flex-basis: 100%;
        }
        .application-head {
          display: block;
        }
        .date {
          margin-top: 8px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap head">
        <strong>재입고신호 · 신청 관리</strong>
        <nav class="global-nav" aria-label="주요 페이지">
          <a href="landing.html">랜딩 페이지</a>
          <a href="demo.html?tutorial=1">데모 페이지</a>
          <a href="apply.html">신청 페이지</a>
        </nav>
        <button id="logout" hidden>로그아웃</button>
      </div>
    </header>
    <main>
      <section class="login" id="login">
        <h1>관리자 확인</h1>
        <p>데모 신청 데이터에는 연락처가 포함되어 있습니다.</p>
        <input
          id="accessKey"
          type="password"
          placeholder="관리자 비밀번호"
          autocomplete="current-password"
        /><button id="loginButton">신청 목록 확인</button>
        <p class="error" id="loginError"></p>
      </section>
      <section class="dashboard wrap" id="dashboard">
        <div class="summary">
          <h1>데모 신청</h1>
          <strong id="total">0건</strong>
        </div>
        <div class="tools">
          <input
            id="search"
            type="search"
            placeholder="스토어명, 담당자, 연락처, 메일 검색"
          /><button id="refresh">새로고침</button
          ><button id="csv">CSV 저장</button>
        </div>
        <div class="list" id="list"></div>
      </section>
    </main>
    <script>
      const API_BASE = "https://naver-restock-alert.vercel.app";
      let accessKey = "",
        applications = [];
      const esc = (value) =>
        String(value ?? "").replace(
          /[&<>"']/g,
          (char) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[char],
        );
      function render() {
        const query = document
            .getElementById("search")
            .value.trim()
            .toLowerCase(),
          rows = applications.filter((item) =>
            JSON.stringify(item).toLowerCase().includes(query),
          );
        document.getElementById("total").textContent =
          `${applications.length}건`;
        document.getElementById("list").innerHTML = rows.length
          ? rows
              .map(
                (item) =>
                  `<article class="application"><div class="application-head"><div><h2>${esc(item.store_name)}</h2><a href="${esc(item.store_url)}" target="_blank" rel="noopener">스토어 열기</a></div><div class="date">${new Date(item.created_at).toLocaleString("ko-KR")}</div></div><div class="data"><div class="datum"><small>월간 품절 수준</small><b>${esc(item.soldout_rate_pct)}%</b></div><div class="datum"><small>품절 문의 빈도</small><b>${esc(item.inquiry_frequency || "-")}</b></div><div class="datum"><small>담당자</small><b>${esc(item.contact_name)}</b></div><div class="datum"><small>연락 가능 일정</small><b>${esc(item.contact_availability)}</b></div><div class="datum"><small>연락처</small><a href="tel:${esc(item.phone)}">${esc(item.phone)}</a></div><div class="datum"><small>메일</small><a href="mailto:${esc(item.email)}">${esc(item.email)}</a></div><div class="datum"><small>상태</small><b>${esc(item.status)}</b></div></div>${item.request_details ? `<div class="request">${esc(item.request_details)}</div>` : ""}</article>`,
              )
              .join("")
          : '<div class="empty">신청 내역이 없습니다.</div>';
      }
      async function load() {
        document.getElementById("loginError").textContent = "";
        try {
          const response = await fetch(API_BASE + "/api/demo-applications", {
            headers: { Authorization: `Bearer ${accessKey}` },
            cache: "no-store",
          });
          const result = await response.json();
          if (!response.ok || !result.ok)
            throw new Error("관리자 비밀번호를 확인해 주세요.");
          applications = result.applications || [];
          document.getElementById("login").style.display = "none";
          document.getElementById("dashboard").classList.add("on");
          document.getElementById("logout").hidden = false;
          render();
        } catch (error) {
          document.getElementById("loginError").textContent = error.message;
        }
      }
      document.getElementById("loginButton").onclick = () => {
        accessKey = document.getElementById("accessKey").value;
        load();
      };
      document.getElementById("accessKey").onkeydown = (event) => {
        if (event.key === "Enter")
          document.getElementById("loginButton").click();
      };
      document.getElementById("search").oninput = render;
      document.getElementById("refresh").onclick = load;
      document.getElementById("logout").onclick = () => location.reload();
      document.getElementById("csv").onclick = () => {
        const fields = [
            "created_at",
            "store_name",
            "store_url",
            "soldout_rate_pct",
            "inquiry_frequency",
            "contact_name",
            "phone",
            "email",
            "contact_availability",
            "request_details",
            "status",
          ],
          quote = (value) => `"${String(value ?? "").replaceAll('"', '""')}"`,
          csv =
            "\ufeff" +
            [
              fields.join(","),
              ...applications.map((item) =>
                fields.map((field) => quote(item[field])).join(","),
              ),
            ].join("\n"),
          url = URL.createObjectURL(
            new Blob([csv], { type: "text/csv;charset=utf-8" }),
          ),
          a = document.createElement("a");
        a.href = url;
        a.download = `demo-applications-${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      };
    </script>
  </body>
</html>
